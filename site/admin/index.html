<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightFox 管理后台</title>
  <meta name="description" content="LightFox 管理后台登录">
  <meta name="robots" content="noindex">
</head>
<body style="margin:0; background:#1c1e22; color:#d7dce2; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;">

  <div style="background:#23262b; border:1px solid #32363d; border-radius:10px; padding:36px 32px; width:100%; max-width:360px; margin:24px;">
    <h1 style="font-size:1.25rem; text-align:center; margin:0 0 6px; color:#eef1f5;">LightFox 管理后台</h1>
    <p style="text-align:center; color:#8b929c; font-size:0.85rem; margin:0 0 24px;">请登录以继续</p>

    <form action="/api/login" method="post">
      <input type="hidden" name="source" value="admin">
      <label for="username" style="display:block; font-size:0.85rem; margin-bottom:6px; color:#8b929c;">用户名</label>
      <input type="text" id="username" name="username" autocomplete="username"
        style="width:100%; box-sizing:border-box; padding:10px 12px; margin-bottom:16px; background:#191b1f; border:1px solid #32363d; border-radius:6px; color:#d7dce2; font-size:0.95rem;">

      <label for="password" style="display:block; font-size:0.85rem; margin-bottom:6px; color:#8b929c;">密码</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
        style="width:100%; box-sizing:border-box; padding:10px 12px; margin-bottom:20px; background:#191b1f; border:1px solid #32363d; border-radius:6px; color:#d7dce2; font-size:0.95rem;">

      <button type="submit"
        style="width:100%; padding:10px 0; background:#58a6ff; color:#10141a; font-weight:600; border:none; border-radius:6px; font-size:0.95rem; cursor:pointer;">
        登 录
      </button>
    </form>

    <p style="text-align:center; margin:18px 0 0; font-size:0.8rem;">
      <a href="/" style="color:#58a6ff; text-decoration:none;">← 返回首页</a>
    </p>
  </div>

</body>
</html>
